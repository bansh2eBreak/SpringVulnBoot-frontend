server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # ClickJacking 漏洞演示 - 受害者页面（漏洞版，无 X-Frame-Options，允许被 iframe 嵌入）
    location = /clickjacking-victim-vuln.html {
        root /usr/share/nginx/html;
    }

    # ClickJacking 漏洞演示 - 受害者页面（安全版，X-Frame-Options: DENY 防止被 iframe 嵌入）
    location = /clickjacking-victim-sec.html {
        root /usr/share/nginx/html;
        add_header X-Frame-Options "DENY" always;
    }
}

# CORS / ClickJacking 漏洞演示 - 攻击者模拟站点
# 端口 81 与靶场前端（端口 80）属于不同 Origin
# 访问方式：http://[host]:81/attacker.html  |  http://[host]:81/clickjacking-attacker.html
server {
    listen 81;
    server_name localhost;

    location / {
        root /usr/share/nginx/attacker;
        index attacker.html;
    }
}
